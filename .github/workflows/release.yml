name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as ci.yml: Xcode 26.3 (Swift 6.2) instead of the image default 16.4.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build app and dmg
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # A tag such as v0.2.0-rc1 is a pre-release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/Driveway-*.dmg \
            --title "Driveway $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            ${flags[@]+"${flags[@]}"}
